name: Trackio PRO Revision Reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a one-time server-side FCM test to the specified user"
        required: false
        default: false
        type: boolean
      test_user_uid:
        description: "Your Firebase Authentication UID (required only for test_push)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: trackio-pro-revision-reminders
  cancel-in-progress: false

jobs:
  send-due-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scheduler dependencies
        working-directory: scheduler
        run: npm install --omit=dev

      - name: Send due recall and revision notifications
        working-directory: scheduler
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_PUSH: ${{ inputs.test_push }}
          TEST_USER_UID: ${{ inputs.test_user_uid }}
        run: npm start
